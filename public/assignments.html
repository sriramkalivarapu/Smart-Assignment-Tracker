<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Assignments</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Assignments</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/add-assignment.html">Add Assignment</a>
        <a href="/assignments.html">View Assignments</a>
    </nav>

    <div class="assignment-controls">

        <input
            type="text"
            id="searchBox"
            placeholder="Search assignments..."
            oninput="displayAssignments()"
        >

        <select id="statusFilter" onchange="displayAssignments()">
            <option value="All">All Status</option>
            <option value="Pending">Pending</option>
            <option value="Completed">Completed</option>
        </select>

        <select id="priorityFilter" onchange="displayAssignments()">
            <option value="All">All Priorities</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>

    </div>

    <div id="assignmentList"></div>

    <script>

        let allAssignments = [];

        async function loadAssignments() {

            const response = await fetch("/api/assignments");

            allAssignments = await response.json();

            displayAssignments();
        }


        function getDueStatus(dueDate, status) {

            if (status === "Completed") {
                return "";
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const due = new Date(dueDate);
            due.setHours(0, 0, 0, 0);

            const difference =
                Math.ceil((due - today) / (1000 * 60 * 60 * 24));

            if (difference < 0) {
                return `<span class="due overdue">Overdue</span>`;
            }

            if (difference === 0) {
                return `<span class="due today">Due Today</span>`;
            }

            if (difference === 1) {
                return `<span class="due upcoming">Due Tomorrow</span>`;
            }

            return `<span class="due upcoming">
                        Due in ${difference} days
                    </span>`;
        }


        function displayAssignments() {

            const list = document.getElementById("assignmentList");

            const search =
                document.getElementById("searchBox").value.toLowerCase();

            const status =
                document.getElementById("statusFilter").value;

            const priority =
                document.getElementById("priorityFilter").value;

            list.innerHTML = "";

            const filteredAssignments = allAssignments.filter(assignment => {

                const matchesSearch =
                    assignment.title.toLowerCase().includes(search) ||
                    assignment.subject.toLowerCase().includes(search);

                const matchesStatus =
                    status === "All" ||
                    assignment.status === status;

                const matchesPriority =
                    priority === "All" ||
                    assignment.priority === priority;

                return matchesSearch &&
                       matchesStatus &&
                       matchesPriority;
            });


            if (filteredAssignments.length === 0) {

                list.innerHTML = `
                    <div class="empty-message">
                        <h2>No assignments found</h2>
                        <p>Try adding an assignment or changing the filters.</p>
                    </div>
                `;

                return;
            }


            filteredAssignments.forEach(assignment => {

                const card = document.createElement("div");

                card.className = "assignment-card";

                card.innerHTML = `

                    <h2>${assignment.title}</h2>

                    <p>
                        <strong>Subject:</strong>
                        ${assignment.subject}
                    </p>

                    <p>
                        <strong>Description:</strong>
                        ${assignment.description || "No description"}
                    </p>

                    <p>
                        <strong>Due Date:</strong>
                        ${assignment.dueDate}
                        ${getDueStatus(
                            assignment.dueDate,
                            assignment.status
                        )}
                    </p>

                    <p>
                        <strong>Priority:</strong>
                        <span class="priority ${assignment.priority.toLowerCase()}">
                            ${assignment.priority}
                        </span>
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span class="status ${assignment.status.toLowerCase()}">
                            ${assignment.status}
                        </span>
                    </p>

                    <div class="button-group">

                        ${
                            assignment.status === "Completed"
                            ?
                            `<button class="completed-btn" disabled>
                                Completed ✓
                            </button>`
                            :
                            `<button onclick="completeAssignment(${assignment.id})">
                                Mark as Completed
                            </button>`
                        }

                        <button
                            class="edit-btn"
                            onclick="editAssignment(${assignment.id})">
                            Edit ✏️
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteAssignment(${assignment.id})">
                            Delete 🗑️
                        </button>

                    </div>
                `;

                list.appendChild(card);

            });
        }


        async function completeAssignment(id) {

            const response =
                await fetch(`/api/assignments/${id}/complete`, {
                    method: "PUT"
                });

            const result = await response.json();

            alert(result.message);

            loadAssignments();
        }


        async function deleteAssignment(id) {

            const confirmDelete =
                confirm("Are you sure you want to delete this assignment?");

            if (!confirmDelete) {
                return;
            }

            const response =
                await fetch(`/api/assignments/${id}`, {
                    method: "DELETE"
                });

            const result = await response.json();

            alert(result.message);

            loadAssignments();
        }


        async function editAssignment(id) {

            const assignment =
                allAssignments.find(a => a.id === id);

            if (!assignment) {
                return;
            }

            const title =
                prompt("Enter assignment title:", assignment.title);

            if (title === null) return;

            const description =
                prompt("Enter description:", assignment.description);

            if (description === null) return;

            const dueDate =
                prompt("Enter due date (YYYY-MM-DD):", assignment.dueDate);

            if (dueDate === null) return;

            const priority =
                prompt(
                    "Enter priority (Low, Medium, High):",
                    assignment.priority
                );

            if (priority === null) return;

            const response =
                await fetch(`/api/assignments/${id}`, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        title,
                        description,
                        dueDate,
                        priority
                    })
                });

            const result = await response.json();

            alert(result.message);

            loadAssignments();
        }


        loadAssignments();

    </script>

</body>

</html>
